<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Превью модели</title>
    <script type="importmap">
      { "imports": { "three": "/three/build/three.module.js", "three/addons/": "/three/examples/jsm/" } }
    </script>
    <style>
      html, body { margin: 0; background: #fff; }
    </style>
  </head>
  <body>
    <script type="module">
      // Рендер превью модели каталога: белый фон, мягкий студийный свет, вид 3/4 спереди (+Z).
      // Параметры нормализации считает scripts/models/render-thumbnails.mjs.
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

      const params = new URLSearchParams(location.search);
      const size = Number(params.get('size') ?? 256);
      const view = params.get('view') ?? 'three-quarter';
      const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
      renderer.setPixelRatio(1);
      renderer.setSize(size, size);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      document.body.appendChild(renderer.domElement);

      const scene = new THREE.Scene();
      scene.background = new THREE.Color('#ffffff');
      scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
      const sun = new THREE.DirectionalLight('#ffffff', 1.2);
      sun.position.set(2, 4, 3);
      scene.add(sun);

      const gltf = await new GLTFLoader().loadAsync(params.get('file'));
      const root = new THREE.Group();
      root.add(gltf.scene);
      root.rotation.set(Number(params.get('rx') ?? 0), Number(params.get('ry') ?? 0), 0, 'YXZ');
      root.scale.setScalar(Number(params.get('scale') ?? 1));
      scene.add(root);

      const box = new THREE.Box3().setFromObject(root);
      const center = box.getCenter(new THREE.Vector3());
      const radius = box.getSize(new THREE.Vector3()).length() / 2;
      const direction = view === 'front' ? new THREE.Vector3(0, 0.15, 1) : new THREE.Vector3(0.75, 0.55, 1);
      const camera = new THREE.PerspectiveCamera(30, 1, radius / 100, radius * 100);
      const distance = radius / Math.sin(THREE.MathUtils.degToRad(15)) * 1.02;
      camera.position.copy(center).addScaledVector(direction.normalize(), distance);
      camera.lookAt(center);
      renderer.render(scene, camera);
      window.__thumbnail = renderer.domElement.toDataURL('image/jpeg', 0.88);
    </script>
  </body>
</html>
