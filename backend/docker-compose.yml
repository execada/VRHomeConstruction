# Локальная разработка: MongoDB + backend. Порты опубликованы только на 127.0.0.1 —
# из локальной сети сервисы недоступны.
#
#   docker compose up -d --build
#
# mongo-express (веб-интерфейс к базе) — отдельным файлом, см. docker-compose.tools.yml.
services:
  mongodb:
    image: mongo:7
    container_name: vr-mongo
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  backend:
    build: .
    container_name: vr-backend
    ports:
      - "127.0.0.1:8080:8080"
    env_file:
      - .env
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongo-data:
