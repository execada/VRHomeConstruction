# Прод-конфиг nginx: SPA + прокси /api на backend (см. docker-compose.prod.yml).

# Вход и коды подтверждения: дополнительный лимит на IP поверх лимитов бэкенда.
limit_req_zone $binary_remote_addr zone=auth:10m rate=30r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Совпадает с лимитом тела запроса бэкенда (MaxRequestBodyBytes = 4 МБ).
    client_max_body_size 4m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml model/gltf+json;
    gzip_min_length 1024;

    include /etc/nginx/snippets/security-headers.conf;

    # API — на Go-бэкенд внутри сети compose. X-Forwarded-For перезаписывается адресом
    # клиента: подставленный клиентом заголовок не дойдёт до бэкенда.
    # Свой add_header отключает наследование заголовков страниц: у API они свои.
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex" always;
    }

    location /api/auth/ {
        limit_req zone=auth burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        add_header X-Robots-Tag "noindex" always;
    }

    # JS/CSS сборки с хэшем в имени не меняются — кешируются навсегда.
    location ~* "^/assets/.+\.[0-9a-f]{8,}\.(?:js|css)$" {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Каталог, модели, текстуры и HDRI лежат без хэша — короткий кеш с ревалидацией
    # (expires не отключает наследование защитных заголовков).
    location /assets/ {
        expires 1h;
        try_files $uri =404;
    }

    location /models/ {
        expires 1d;
        try_files $uri =404;
    }

    # index.html не кешируется: после деплоя браузер сразу получает новые ассеты.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # SPA-роутинг: всё остальное — на index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
