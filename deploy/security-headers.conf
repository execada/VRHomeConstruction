# Защитные заголовки для страниц и статики. Подключается в server и в каждом location,
# где есть свой add_header (иначе nginx не наследует заголовки уровня server).
#
# CSP: всё грузится только со своего origin. data:/blob: — превью проектов (data URL),
# текстуры и буферы из GLB, которые three.js распаковывает в blob-URL.
# 'wasm-unsafe-eval' разрешает только компиляцию WebAssembly (декодер meshopt для GLB),
# eval для JavaScript по-прежнему запрещён.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' data: blob:; worker-src 'self' blob:; font-src 'self' data:; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# WebXR (VR-режим) разрешён только своему origin; камера/микрофон/геолокация не нужны.
add_header Permissions-Policy "xr-spatial-tracking=(self), camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Включайте только при раздаче по HTTPS (TLS на этом nginx или на балансировщике перед ним):
# add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
